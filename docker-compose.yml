# Host ports are chosen to avoid other local stacks (3080 / 5433 are already used on this machine).
name: ward-deposit
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ward_owner
      POSTGRES_PASSWORD: ward_owner_dev
      POSTGRES_DB: ward_deposit
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - ward_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ward_owner -d ward_deposit"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: ward-deposit-app  # build with: docker build -t ward-deposit-app .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://ward_app:ward_app_dev@db:5432/ward_deposit
      SLIP_STORAGE_DIR: /data/slips
      COOKIE_SECURE: "false"   # dev over http only; remove behind HTTPS
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - ward_slips:/data/slips
volumes:
  ward_pgdata:
  ward_slips:
